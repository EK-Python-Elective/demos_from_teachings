[project]
name = "qr"
version = "0.1.0"
description = "Print a QR code for any text, in the terminal"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "clbokea", email = "clbo@kea.dk" }]
dependencies = [
    "segno>=1.6",
]

[project.scripts]
qr = "qr.cli:main"

# Flat layout + hatchling, mirroring mistral-vibe's pyproject.toml.
# (uv's own default is a src/ layout with the uv_build backend — see the demo README.)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["qr/"]
