[project]
name = "dadjoke"
version = "0.1.0"
description = "Print a random dad joke from icanhazdadjoke.com"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "clbokea", email = "clbo@kea.dk" }]
dependencies = [
    "httpx>=0.28",
]

[project.scripts]
dadjoke = "dadjoke.cli:main"

# Flat layout + hatchling, mirroring mistral-vibe's pyproject.toml.
# (uv's own default is a src/ layout with the uv_build backend — see the demo README.)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["dadjoke/"]
