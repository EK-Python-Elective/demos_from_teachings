# A faithful mirror of mistral-vibe-ek-python-elective's `[tool.ruff]`, rewritten
# as a standalone `ruff.toml` (drop the `tool.ruff` prefix, keep the rest verbatim).
#
# The ONLY change from the fork: `ruff_check_failures.py` is added to `include`,
# because the fork's `include` is scoped to `vibe/**` + `tests/**` and this
# fixture lives at the repo root. Everything else — the select/ignore set, the
# flake8-tidy-imports / isort / pylint sub-configs, line-length, preview — is the
# fork's config, so `uvx ruff check ruff_check_failures.py` here reports exactly
# what the fork's CI (`Exam checks`) would.

include = ["vibe/**/*.py", "tests/**/*.py", "ruff_check_failures.py"]
exclude = ["pyinstaller/"]
line-length = 88
target-version = "py312"
preview = true

[format]
skip-magic-trailing-comma = true

[lint]
select = [
    "F",
    "I",
    "D2",
    "UP",
    "TID",
    "ANN",
    "PLR",
    "B0",
    "B905",
    "RUF022",
    "RUF010",
    "RUF012",
    "RUF019",
    "RUF100",
]
ignore = ["D203", "D205", "D213", "ANN401", "PLR6301"]

[lint.per-file-ignores]
"tests/*" = ["ANN", "PLR"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.isort]
known-first-party = ["vibe"]
force-sort-within-sections = true
split-on-trailing-comma = false
combine-as-imports = true
force-wrap-aliases = false
order-by-type = true
required-imports = ["from __future__ import annotations"]

[lint.pylint]
max-public-methods = 26
max-positional-args = 10
max-statements = 50
max-branches = 15
max-locals = 15
max-args = 10
max-returns = 6
max-nested-blocks = 5
